# ===========================================================================
# 【仅测试用】mock 上游协议档案 —— “真实协议形状”变体
#
# 与 protocol_mock.yaml 的唯一区别：发送消息的 path 带 {conversation_id}，
# 且新增 create_conversation 端点（/api/new-portal/generate/id）。
# 这与 protocol/current/profile.yaml 里抓包确认到的形状一致，
# 用于验证「没有会话时新建会话 / stateless 每次新建 / auto 复用」这三条路径。
#
# 警告：此文件描述的是 tests/fixtures/mock_upstream.py 这个“假上游”的协议，
#       它【不是】AI Studio 的真实协议。
# ===========================================================================
protocol_version: "mock-path-1"
status: frozen
generated_at: "2026-09-17"

upstream:
  base_url:
    value: "http://127.0.0.1:8099"
    status: confirmed
    evidence: "test fixture"
  api_prefix:
    value: "/api"
    status: confirmed
    evidence: "test fixture"

auth:
  type: cookie
  status: confirmed
  evidence: "test fixture"
  cookie_names: ["mock_session"]
  required_headers: {}
  signed:
    value: false
    status: confirmed
    evidence: "test fixture"

endpoints:
  send_message:
    method: POST
    path: "/api/new-portal/chat/{conversation_id}"
    status: confirmed
    evidence: "test fixture（形状对齐 protocol/current/profile.yaml）"
  create_conversation:
    method: POST
    path: "/api/new-portal/generate/id"
    status: confirmed
    evidence: "test fixture"
  stop_generation:
    method: POST
    path: "/api/new-portal/stop/chat"
    status: confirmed
    evidence: "test fixture"
  models:
    method: GET
    path: "/api/models"
    status: confirmed
    evidence: "test fixture"
  user_info:
    method: GET
    path: "/api/new-portal/getuserinfo"
    status: confirmed
    evidence: "test fixture"

request_schema:
  status: confirmed
  history_mode: prompt_only
  system_mode: fold_into_user
  passthrough_params: ["temperature"]
  create_conversation_body:
    agentId: "{agent_id}"
    characterId: ""
    cloneId: ""
    forceNew: true
  create_conversation_id_paths: ["$.data.id", "$.id"]
  # 注意：conversation_id 只在 URL 路径里，body 里不带（与真实档案一致）
  body_template:
    model: "{model}"
    prompt: "{prompt}"
    stream: "{stream}"
  stop_body_template:
    conversation_id: "{conversation_id}"

response_schema:
  status: confirmed
  content_paths: ["$.data.content", "$.content"]
  conversation_id_paths: ["$.data.conversation_id", "$.conversation_id"]
  message_id_paths: ["$.data.message_id", "$.message_id"]
  finish_paths: ["$.data.finish_reason", "$.finish_reason"]
  usage_paths: ["$.data.usage", "$.usage"]

stream:
  transport: sse
  parser: sse
  status: confirmed
  evidence: "test fixture"
  done_marker: "[DONE]"
  event_map:
    text: ["$.delta.content", "$.content"]
    reasoning: ["$.delta.reasoning"]
    finish: ["$.delta.finish_reason", "$.finish_reason"]
    usage: ["$.usage"]
    conversation_id: ["$.conversation_id"]
    message_id: ["$.message_id"]
  event_name_map:
    ping: ignore
    text: text
    finish: finish

models:
  mock-chat: mock-chat-v1
default_model: "mock-chat-v1"

features:
  streaming: {value: true, status: confirmed, evidence: "test fixture"}
  reasoning: {value: true, status: confirmed, evidence: "test fixture"}
  stop_generation: {value: true, status: confirmed, evidence: "test fixture"}
  multi_turn: {value: true, status: confirmed, evidence: "test fixture"}
  file_upload: {value: false, status: confirmed, evidence: "test fixture"}
  image_input: {value: false, status: confirmed, evidence: "test fixture"}

notes: "仅供离线单测使用；不得据此声称任何 AI Studio 真实协议结论。"
